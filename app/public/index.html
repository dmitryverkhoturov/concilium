<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concilium</title>
  <link rel="icon" href="mark.svg" type="image/svg+xml">
  <!-- Fonts ship with the app: no requests to outside servers, works offline. -->
  <link rel="stylesheet" href="/vendor/fonts/literata/400.css">
  <link rel="stylesheet" href="/vendor/fonts/literata/500.css">
  <link rel="stylesheet" href="/vendor/fonts/literata/600.css">
  <link rel="stylesheet" href="/vendor/fonts/manrope/400.css">
  <link rel="stylesheet" href="/vendor/fonts/manrope/500.css">
  <link rel="stylesheet" href="/vendor/fonts/manrope/600.css">
  <link rel="stylesheet" href="/vendor/fonts/manrope/700.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aura" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

  <header class="top">
    <button class="icon-btn only-narrow" id="toggleSide" aria-label="menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="brand"><img class="logo" src="logo.svg" alt=""><span data-i18n="app">Concilium</span></div>
    <nav class="people" id="people"></nav>
    <div class="spacer"></div>
    <button class="ghost" id="toggleMap" data-i18n="map">Карта</button>
    <button class="ghost lang" id="lang">EN</button>
  </header>

  <main class="layout">
    <aside class="side glass" id="side">
      <button class="primary wide" id="newChat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="newChat">Новый разговор</span></button>
      <div class="side-title" data-i18n="chats">Разговоры</div>
      <ul class="sessions" id="sessions"></ul>
      <div class="memory" id="memory"></div>
    </aside>

    <section class="chat">
      <div class="messages" id="messages"></div>
      <div class="composer">
        <div class="actions" id="actions"></div>
        <div class="inputrow glass">
          <button class="mic" id="mic" aria-label="mic">
            <span class="halo"></span><span class="ring"></span><span class="ring r2"></span>
            <span class="core">
              <svg class="mic-ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
              <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
            </span>
          </button>
          <textarea id="input" rows="1" data-i18n-ph="placeholder"></textarea>
          <button class="send" id="send" aria-label="send">
            <svg class="go" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            <svg class="stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
          </button>
        </div>
      </div>
    </section>

    <aside class="panel glass" id="panel">
      <div class="panel-head">
        <div class="tabs">
          <button class="tab active" data-tab="graph" data-i18n="map">Карта</button>
          <button class="tab" data-tab="note" data-i18n="note">Заметка</button>
        </div>
        <div class="spacer"></div>
        <button class="icon-btn" id="closePanel" aria-label="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="tabbody" id="graphTab">
        <div id="graph"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="tabbody hidden" id="noteTab"><article class="note" id="note"></article></div>
    </aside>
  </main>

  <dialog id="addPerson">
    <form method="dialog" id="addForm">
      <h3 data-i18n="addTitle">Добавить человека</h3>
      <label><span data-i18n="name">Имя</span><input name="name" required></label>
      <label><span data-i18n="folder">Папка с заметками о здоровье</span><input name="path" required placeholder="C:\Obsidian\...\Здоровье"></label>
      <p class="err" id="addErr"></p>
      <div class="row"><button value="cancel" class="ghost" formnovalidate data-i18n="cancel">Отмена</button><button class="primary" value="ok" data-i18n="add">Добавить</button></div>
    </form>
  </dialog>

  <script src="vendor/marked/marked.umd.js"></script>
  <script src="vendor/force-graph/force-graph.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
